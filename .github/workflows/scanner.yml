name: SGX Daily Stock Scanner

on:
  schedule:
    # Runs daily at 00:00 UTC (8:00 AM Singapore Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SGX Scanner Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sgx_scanner.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload HTML & Data Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads index.html and data.json directly

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
