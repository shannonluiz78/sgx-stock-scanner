name: Run Stock Scanner

on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  scan-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests beautifulsoup4 openpyxl lxml

      - name: Run Scanner Script
        run: python sgx_scanner.py

      - name: Save Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update stock data [skip ci]"
          file_pattern: "data.json"
