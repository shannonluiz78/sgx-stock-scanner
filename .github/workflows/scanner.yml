name: SGX Core 8 Dashboard Automation

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically daily at midnight UTC
  workflow_dispatch:      # Enables manual trigger from GitHub Actions UI

permissions:
  contents: write        # Required for committing files to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy lxml requests beautifulsoup4 html5lib openpyxl

      - name: Run SGX Scanner Script
        run: python sgx_scanner.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
