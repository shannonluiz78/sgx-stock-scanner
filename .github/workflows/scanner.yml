name: SGX Core 8 Dashboard Automation

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs daily at midnight UTC
  workflow_dispatch:     # Enables the manual "Run workflow" button in GitHub Actions

permissions:
  contents: write       # CRITICAL: Grants write access to deploy to gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy lxml requests

      - name: Run SGX Scanner Script
        run: python sgx_scanner.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
