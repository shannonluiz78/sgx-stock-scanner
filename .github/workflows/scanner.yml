name: Weekly SGX Stock Scanner

on:
  schedule:
    # Runs at 01:00 UTC every Sunday (9:00 AM SGT)
    - cron: '0 1 * * 0'
  workflow_dispatch: # Manual trigger button

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Run SGX Scanner
        run: python sgx_scanner.py

      - name: Commit and Push index.html
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update index.html dashboard" && git push)
