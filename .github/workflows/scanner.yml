name: SGX Daily Stock Scanner

on:
  schedule:
    # Daily scan at 00:00 UTC (8:00 AM SGT)
    - cron: '0 0 * * *'
    # Weekly Sunday scan at 01:00 UTC (9:00 AM SGT)
    - cron: '0 1 * * 0'
  workflow_dispatch: # Enables manual ad-hoc triggering

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows peaceiris/actions-gh-pages to push to gh-pages branch

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Run SGX Scanner Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sgx_scanner.py

      - name: Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
