name: Weekly SGX Stock Scanner

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: 4. Execute Scanner Script
        run: python sgx_scanner.py

      - name: 5. Commit and Push Generated Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-update SGX Stock Scanner Dashboard" || echo "No changes to commit"
          git push
