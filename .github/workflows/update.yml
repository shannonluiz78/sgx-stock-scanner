name: Update Stock Data

on:
  schedule:
    - cron: '0 1 * * 1-5'  # Runs daily on weekdays
  workflow_dispatch:        # Enables the manual 'Run workflow' button

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # ⏱️ Kills the job if it takes longer than 5 minutes

    permissions:
      contents: write       # 🔑 Gives GitHub permissions to commit data.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests

      - name: Fetch Stock Data
        run: python main.py  # ⚠️ Make sure this matches your script's filename!

      - name: Commit and Push Updated data.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update data.json [skip ci]"
          file_pattern: "data.json"
